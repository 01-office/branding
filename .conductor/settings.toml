#:schema https://conductor.build/schemas/settings.repo.schema.json

[scripts]
# Install root library deps (the `prepare` script builds dist via tsc) and the
# Vite playground deps. Both packages ship a package-lock.json.
setup = "pnpm install && pnpm install --prefix playground"

# Launch the Vite playground dev server on the workspace's assigned port so
# multiple workspaces can run side by side without colliding.
run = "pnpm run dev --prefix playground -- --port $CONDUCTOR_PORT --strictPort"

# Each workspace serves on its own CONDUCTOR_PORT with no shared local state,
# so workspaces can run at the same time.
run_mode = "concurrent"
